<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌀 GravitationaL Strategic ROI Tracker | GoMining</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0c10;
  --bg-panel: #0f1218;
  --bg-card: #141820;
  --bg-input: #1a1f2a;
  --border: #1e2530;
  --border-glow: #2a3545;
  --text-primary: #e8ecf2;
  --text-secondary: #7a8599;
  --text-dim: #4a5568;
  --accent-cyan: #00d4ff;
  --accent-cyan-dim: rgba(0, 212, 255, 0.15);
  --accent-purple: #8b5cf6;
  --accent-purple-dim: rgba(139, 92, 246, 0.15);
  --accent-green: #10b981;
  --accent-green-dim: rgba(16, 185, 129, 0.15);
  --accent-red: #ef4444;
  --accent-red-dim: rgba(239, 68, 68, 0.15);
  --accent-amber: #f59e0b;
  --accent-amber-dim: rgba(245, 158, 11, 0.15);
  --accent-gold: #fbbf24;
  --accent-btc: #f7931a;
  --radius: 8px;
  --radius-lg: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
              linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 12px; }
.header { text-align: center; padding: 16px 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.header h1 {
  font-family: 'Orbitron', monospace;
  font-size: 1.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-btc), var(--accent-cyan), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}
.header .sub { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--text-dim); letter-spacing: 3px; margin-top: 4px; }
.price-ticker {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
}
.price-item { display: flex; align-items: center; gap: 8px; }
.price-icon {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: bold;
}
.price-icon.btc { background: linear-gradient(135deg, #f7931a, #e8850a); color: #fff; }
.price-icon.gmt { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
.price-label { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--text-dim); letter-spacing: 1px; }
.price-value { font-family: 'Orbitron', monospace; font-size: 0.95rem; font-weight: 700; }
.price-value.btc-color { color: var(--accent-btc); }
.price-value.gmt-color { color: var(--accent-purple); }
.price-change { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 2px 5px; border-radius: 4px; }
.price-change.up { background: var(--accent-green-dim); color: var(--accent-green); }
.price-change.down { background: var(--accent-red-dim); color: var(--accent-red); }
.tab-bar {
  display: flex; gap: 3px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 3px;
  margin-bottom: 12px;
  overflow-x: auto;
}
.tab-btn {
  flex: 1; min-width: 70px;
  padding: 7px 8px;
  border: none; border-radius: var(--radius);
  background: transparent;
  color: var(--text-secondary);
  font-family: 'Orbitron', monospace;
  font-size: 0.5rem; font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text-primary); background: var(--bg-card); }
.tab-btn.active {
  background: linear-gradient(135deg, var(--accent-cyan-dim), var(--accent-purple-dim));
  color: var(--accent-cyan);
  border: 1px solid rgba(0,212,255,0.2);
}
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
@keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 10px;
}
.card-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.card-header h3 {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--accent-cyan);
}
.card-header .icon { font-size: 1rem; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat-box {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  text-align: center;
}
.stat-box.hl-green { border-color: var(--accent-green); background: var(--accent-green-dim); }
.stat-box.hl-red { border-color: var(--accent-red); background: var(--accent-red-dim); }
.stat-box.hl-btc { border-color: var(--accent-btc); background: rgba(247,147,26,0.1); }
.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem; color: var(--text-dim);
  letter-spacing: 1px; margin-bottom: 3px;
}
.stat-value { font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 700; }
.stat-value.pos { color: var(--accent-green); }
.stat-value.neg { color: var(--accent-red); }
.stat-value.neu { color: var(--accent-cyan); }
.stat-value.gold { color: var(--accent-gold); }
.stat-value.btc { color: var(--accent-btc); }
.stat-value.gmt { color: var(--accent-purple); }
.stat-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--text-dim); margin-top: 2px; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 8px; }
.form-group { display: flex; flex-direction: column; gap: 2px; }
.form-group label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem; color: var(--text-dim);
  letter-spacing: 1px;
}
input, select, textarea {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 9px;
  color: var(--text-primary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  outline: none;
}
input:focus, select:focus { border-color: var(--accent-cyan); }
select option { background: var(--bg-card); }
.btn {
  padding: 7px 14px;
  border: none; border-radius: var(--radius);
  font-family: 'Orbitron', monospace;
  font-size: 0.55rem; font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: linear-gradient(135deg, var(--accent-cyan), #0099cc); color: #000; }
.btn-primary:hover { box-shadow: 0 0 15px rgba(0,212,255,0.4); }
.btn-purple { background: linear-gradient(135deg, var(--accent-purple), #6d28d9); color: #fff; }
.btn-btc { background: linear-gradient(135deg, var(--accent-btc), #e8850a); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-ghost:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.alert {
  padding: 8px 12px;
  border-radius: var(--radius);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.alert-info { background: var(--accent-cyan-dim); border: 1px solid rgba(0,212,255,0.2); color: var(--accent-cyan); }
.alert-warn { background: var(--accent-amber-dim); border: 1px solid rgba(245,158,11,0.2); color: var(--accent-amber); }
.alert-success { background: var(--accent-green-dim); border: 1px solid rgba(16,185,129,0.2); color: var(--accent-green); }
.scenario-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.scenario-box {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  text-align: center;
}
.scenario-box.bear { border-color: var(--accent-red); }
.scenario-box.base { border-color: var(--accent-amber); }
.scenario-box.bull { border-color: var(--accent-green); }
.scenario-label { font-family: 'Orbitron', monospace; font-size: 0.55rem; letter-spacing: 1px; margin-bottom: 6px; }
.scenario-box.bear .scenario-label { color: var(--accent-red); }
.scenario-box.base .scenario-label { color: var(--accent-amber); }
.scenario-box.bull .scenario-label { color: var(--accent-green); }
.strat-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 8px;
}
.strat-card h4 {
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  letter-spacing: 1px;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.strat-card p { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-secondary); line-height: 1.5; }
.strat-card.recommended { border-color: var(--accent-green); background: var(--accent-green-dim); }
.strat-card.cautious { border-color: var(--accent-amber); background: var(--accent-amber-dim); }
.strat-card.avoid { border-color: var(--accent-red); background: var(--accent-red-dim); }
.ev-box {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  line-height: 1.6;
  color: var(--text-secondary);
}
.ev-box .formula { color: var(--accent-cyan); }
.divider { height: 1px; background: var(--border); margin: 10px 0; }
.text-green { color: var(--accent-green); }
.text-red { color: var(--accent-red); }
.text-cyan { color: var(--accent-cyan); }
.text-amber { color: var(--accent-amber); }
.text-btc { color: var(--accent-btc); }
.text-gmt { color: var(--accent-purple); }
.text-dim { color: var(--text-dim); }
table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }
th {
  font-family: 'Orbitron', monospace;
  font-size: 0.45rem; font-weight: 600;
  letter-spacing: 1px;
  color: var(--text-dim);
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}
td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
tr:hover td { background: rgba(0,212,255,0.03); }
.tag { display: inline-block; padding: 2px 5px; border-radius: 3px; font-size: 0.55rem; font-weight: 600; }
.tag-green { background: var(--accent-green-dim); color: var(--accent-green); }
.tag-red { background: var(--accent-red-dim); color: var(--accent-red); }
.tag-amber { background: var(--accent-amber-dim); color: var(--accent-amber); }
.tag-cyan { background: var(--accent-cyan-dim); color: var(--accent-cyan); }
.tag-purple { background: var(--accent-purple-dim); color: var(--accent-purple); }
.verdict-box { text-align: center; padding: 14px; border-radius: var(--radius-lg); margin-bottom: 10px; }
.verdict-box h4 { font-family: 'Orbitron', monospace; font-size: 0.9rem; font-weight: 800; margin-bottom: 4px; }
.verdict-box p { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; }
.del-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; padding: 2px 4px; }
.del-btn:hover { color: var(--accent-red); }
@media (max-width: 768px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .scenario-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 480px) {
  .form-row { grid-template-columns: 1fr; }
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }
</style>
</head>

// =====================================================
// PRICE FETCHING (CoinGecko Free API)
// =====================================================
async function fetchPrices() {
  const apiUrl = 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,gomining-token&vs_currencies=usd&include_24hr_change=true';
  
  // Try direct first, then CORS proxies as fallback
  const endpoints = [
    apiUrl,
    'https://corsproxy.io/?' + encodeURIComponent(apiUrl),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl)
  ];
  
  for(const url of endpoints) {
    try {
      const res = await fetch(url, { timeout: 5000 });
      if(!res.ok) continue;
      
      const d = await res.json();
      if(!d.bitcoin) continue; // Invalid response
      
      data.prices.btc = d.bitcoin?.usd || 0;
      data.prices.btc24h = d.bitcoin?.usd_24h_change || 0;
      data.prices.gmt = d['gomining-token']?.usd || 0;
      data.prices.gmt24h = d['gomining-token']?.usd_24h_change || 0;
      data.prices.lastUpdate = new Date();
      data.prices.sats = data.settings.sats || 38;
      
      updatePriceTicker();
      saveData();
      console.log('✅ Prices loaded successfully');
      return; // Success, exit
    } catch(e) {
      console.log('Trying next endpoint...');
    }
  }
  
  // All failed - use cached or defaults
  console.log('⚠️ Price fetch failed, using cached/defaults');
  if(!data.prices.btc) {
    data.prices.btc = 97000;
    data.prices.gmt = 0.32;
    data.prices.btc24h = 0;
    data.prices.gmt24h = 0;
  }
  updatePriceTicker();
}

function updatePriceTicker() {
  const p = data.prices;
  document.getElementById('btcPrice').textContent = p.btc ? '$' + p.btc.toLocaleString() : '$--,---';
  document.getElementById('gmtPrice').textContent = p.gmt ? '$' + p.gmt.toFixed(3) : '$-.--';
  
  const btcChg = document.getElementById('btcChange');
  btcChg.textContent = (p.btc24h >= 0 ? '+' : '') + (p.btc24h?.toFixed(1) || 0) + '%';
  btcChg.className = 'price-change ' + (p.btc24h >= 0 ? 'up' : 'down');
  
  const gmtChg = document.getElementById('gmtChange');
  gmtChg.textContent = (p.gmt24h >= 0 ? '+' : '') + (p.gmt24h?.toFixed(1) || 0) + '%';
  gmtChg.className = 'price-change ' + (p.gmt24h >= 0 ? 'up' : 'down');
  
  document.getElementById('satsPerTH').textContent = p.sats + ' sats';
  document.getElementById('priceTime').textContent = p.lastUpdate ? new Date(p.lastUpdate).toLocaleTimeString() : '--:--';
}

// =====================================================
// MINING CALCULATIONS (GoMining Formulas)
// =====================================================
function calcMiningRewards(th, ee, discPct, btcPrice, satsPerTH, elecCost = 0.05, servCost = 0.0089) {
  // Gross reward in sats
  const grossSats = th * satsPerTH;
  const grossBTC = grossSats / 1e8;
  const grossUSD = grossBTC * btcPrice;
  
  // Electricity cost: (kWh * 24 / 1000) * W/TH * TH = daily watts, then * $/kWh
  const dailyWatts = (ee * th * 24) / 1000; // kWh
  const elecUSD = dailyWatts * elecCost;
  const elecBTC = elecUSD / btcPrice;
  
  // Service cost: $0.0089 * TH / BTC price
  const servUSD = servCost * th;
  const servBTC = servUSD / btcPrice;
  
  // Total maintenance
  const maintUSD = elecUSD + servUSD;
  const maintBTC = elecBTC + servBTC;
  
  // Apply discount
  const discMult = 1 - (discPct / 100);
  const netMaintUSD = maintUSD * discMult;
  const netMaintBTC = maintBTC * discMult;
  
  // Net reward
  const netBTC = grossBTC - netMaintBTC;
  const netSats = netBTC * 1e8;
  const netUSD = netBTC * btcPrice;
  
  return { grossSats, grossBTC, grossUSD, elecUSD, servUSD, maintUSD, netMaintUSD, netBTC, netSats, netUSD, discPct };
}

function calculateMining() {
  const th = parseFloat(document.getElementById('calcTH').value) || 0;
  const ee = parseFloat(document.getElementById('calcEE').value) || 20;
  const elec = parseFloat(document.getElementById('calcElec').value) || 0.05;
  const serv = parseFloat(document.getElementById('calcServ').value) || 0.0089;
  const tokenDisc = parseFloat(document.getElementById('calcTokenDisc').value) || 0;
  const servDisc = parseFloat(document.getElementById('calcServDisc').value) || 0;
  const vipDisc = parseFloat(document.getElementById('calcVIPDisc').value) || 0;

function calcGrowth() {
  const curTH = parseFloat(document.getElementById('growCurTH').value) || 0;

  const costTH = parseFloat(document.getElementById('growCostTH').value) || 55;

  const btcPrice = data.prices.btc || 97000;
  const sats = data.settings.sats || 38;
  const disc = data.settings.disc || 23;
  
  const thNeeded = tgtTH - curTH;
  const totalCost = thNeeded * costTH;
  
  // Current earnings
  const curRewards = calcMiningRewards(curTH, data.settings.ee, disc, btcPrice, sats);
  // Target earnings (better efficiency)
  const tgtRewards = calcMiningRewards(tgtTH, tgtEE, disc, btcPrice, sats);
  
  const dailyIncrease = tgtRewards.netUSD - curRewards.netUSD;
  const monthlyIncrease = dailyIncrease * 30;
  const breakEvenDays = dailyIncrease > 0 ? Math.ceil(totalCost / dailyIncrease) : Infinity;

        <div class="stat-box"><div class="stat-label">${p.name}</div><div class="stat-value gold">$${p.daily.toFixed(2)}/day</div><div class="stat-sub">$${(p.daily*365).toFixed(0)}/yr</div></div>

function calcReinvest() {
  const monthlyNet = parseFloat(document.getElementById('reinvMonth').value) || 50;
  const rate = parseFloat(document.getElementById('reinvRate').value) / 100;
  const months = parseInt(document.getElementById('reinvMonths').value) || 12;
  const costTH = 55; // avg cost per TH
  const btcPrice = data.prices.btc || 97000;
  const sats = data.settings.sats || 38;
  const disc = data.settings.disc || 23;
  
  let th = data.settings.th;
  let totalInvested = 0;
  let projections = [];
  
  for(let m = 1; m <= months; m++) {
    const rewards = calcMiningRewards(th, 17, disc, btcPrice, sats);
    const monthlyEarn = rewards.netUSD * 30;
    const reinvest = monthlyEarn * rate;
    const newTH = reinvest / costTH;
    th += newTH;
    totalInvested += reinvest;
    
    if(m % 3 === 0 || m === months) {
      projections.push({ month: m, th: th.toFixed(1), monthly: monthlyEarn.toFixed(2), invested: totalInvested.toFixed(0) });
    }
  }
  
  const finalRewards = calcMiningRewards(th, 17, disc, btcPrice, sats);
  
  document.getElementById('reinvestResults').innerHTML = `
    <div class="verdict-box" style="background:var(--accent-purple-dim);border:1px solid var(--accent-purple);">
      <h4 class="text-gmt">🔄 COMPOUND PROJECTION</h4>
      <p>After ${months} months at ${rate*100}% reinvestment: ${th.toFixed(1)} TH/s | $${(finalRewards.netUSD*30).toFixed(2)}/mo</p>
    </div>
    <div style="overflow-x:auto;"><table>
      <thead><tr><th>MONTH</th><th>TH/S</th><th>MONTHLY $</th><th>TOTAL INVESTED</th></tr></thead>
      <tbody>${projections.map(p => `<tr><td>${p.month}</td><td>${p.th}</td><td>$${p.monthly}</td><td>$${p.invested}</td></tr>`).join('')}</tbody>
    </table></div>
  `;
}

function evaluateDeal() {
  const price = parseFloat(document.getElementById('scanPrice').value) || 0;
  const th = parseFloat(document.getElementById('scanTH').value) || 0;
  const ee = parseFloat(document.getElementById('scanEE').value) || 20;
  const name = document.getElementById('scanName').value || 'Unnamed Miner';
  
  if(price <= 0 || th <= 0) {
    document.getElementById('scanResults').innerHTML = '<div class="alert alert-warn">⚠️ Enter price and TH/s to evaluate</div>';
    return;
  }
  
  const btcPrice = data.prices.btc || 97000;
  const sats = data.settings.sats || 38;
  const disc = data.settings.disc || 23;
  
  // Calculate metrics
  const costPerTH = price / th;
  const rewards = calcMiningRewards(th, ee, disc, btcPrice, sats);
  const dailyNet = rewards.netUSD;
  const monthlyNet = dailyNet * 30;
  const yearlyNet = dailyNet * 365;
  const breakevenDays = dailyNet > 0 ? Math.ceil(price / dailyNet) : Infinity;
  const breakevenMonths = (breakevenDays / 30).toFixed(1);
  const roi1yr = ((yearlyNet / price) * 100).toFixed(1);
  
  // Get alert thresholds
  const alerts = data.alerts || {};
  const maxCostTH = alerts.maxCostTH || 50;
  const greatCostTH = alerts.greatCostTH || 40;
  const maxEE = alerts.maxEE || 18;
  const maxBreakeven = alerts.maxBreakeven || 18;
  
  // Determine verdict
  let verdict = 'FAIR DEAL';
  let verdictClass = '';
  let verdictIcon = '📊';
  let isGreatDeal = false;
  let isGoodDeal = false;
  
  if(costPerTH <= greatCostTH && ee <= maxEE && breakevenMonths <= maxBreakeven) {
    verdict = '🔥 GREAT DEAL! 🔥';
    verdictClass = 'hl-green';
    verdictIcon = '🚀';
    isGreatDeal = true;
  } else if(costPerTH <= maxCostTH && ee <= maxEE) {
    verdict = '✅ GOOD DEAL';
    verdictClass = 'hl-green';
    verdictIcon = '👍';
    isGoodDeal = true;
  } else if(costPerTH > 65 || breakevenMonths > 24) {
    verdict = '⚠️ OVERPRICED';
    verdictClass = 'hl-red';
    verdictIcon = '👎';
  } else if(ee > 22) {
    verdict = '⚠️ LOW EFFICIENCY';
    verdictClass = 'hl-red';
    verdictIcon = '⚡';
  }
  
  // Score out of 100
  let score = 50;
  score += (55 - costPerTH) * 1.5; // $/TH factor
  score += (18 - ee) * 2; // Efficiency factor
  score += (18 - breakevenMonths) * 1; // Breakeven factor
  score = Math.max(0, Math.min(100, Math.round(score)));
  
  const scoreColor = score >= 75 ? 'var(--accent-green)' : score >= 50 ? 'var(--accent-amber)' : 'var(--accent-red)';
  
  document.getElementById('scanResults').innerHTML = `
    <div class="verdict-box ${verdictClass}" style="background:${isGreatDeal ? 'var(--accent-green-dim)' : isGoodDeal ? 'var(--accent-cyan-dim)' : 'var(--bg-input)'};border:1px solid ${isGreatDeal ? 'var(--accent-green)' : isGoodDeal ? 'var(--accent-cyan)' : 'var(--border)'};">
      <h4 style="font-size:1.1rem;">${verdict}</h4>
      <p>${name} • ${th} TH @ $${price.toLocaleString()}</p>
    </div>
    <div class="stat-grid">
      <div class="stat-box ${costPerTH <= greatCostTH ? 'hl-green' : costPerTH <= maxCostTH ? '' : 'hl-red'}">
        <div class="stat-label">$/TH</div>
        <div class="stat-value ${costPerTH <= greatCostTH ? 'pos' : costPerTH <= maxCostTH ? 'neu' : 'neg'}">$${costPerTH.toFixed(2)}</div>
        <div class="stat-sub">${costPerTH <= greatCostTH ? '🔥 Excellent' : costPerTH <= maxCostTH ? '✅ Good' : '⚠️ High'}</div>
      </div>
      <div class="stat-box ${ee <= 15 ? 'hl-green' : ee <= maxEE ? '' : 'hl-red'}">
        <div class="stat-label">EFFICIENCY</div>
        <div class="stat-value ${ee <= 15 ? 'pos' : ee <= maxEE ? 'neu' : 'neg'}">${ee} W/TH</div>
        <div class="stat-sub">${ee <= 15 ? '🔥 Optimal' : ee <= maxEE ? '✅ Good' : '⚠️ High fees'}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">DAILY NET</div>
        <div class="stat-value ${dailyNet > 0 ? 'pos' : 'neg'}">$${dailyNet.toFixed(3)}</div>
        <div class="stat-sub">${Math.round(rewards.netSats)} sats</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">MONTHLY</div>
        <div class="stat-value gold">$${monthlyNet.toFixed(2)}</div>
      </div>
      <div class="stat-box ${breakevenMonths <= 12 ? 'hl-green' : breakevenMonths <= maxBreakeven ? '' : 'hl-red'}">
        <div class="stat-label">BREAK-EVEN</div>
        <div class="stat-value ${breakevenMonths <= 12 ? 'pos' : breakevenMonths <= maxBreakeven ? 'neu' : 'neg'}">${breakevenMonths} mo</div>
        <div class="stat-sub">${breakevenDays} days</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">1-YR ROI</div>
        <div class="stat-value ${roi1yr > 50 ? 'pos' : roi1yr > 0 ? 'neu' : 'neg'}">${roi1yr}%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">DEAL SCORE</div>
        <div class="stat-value" style="color:${scoreColor};font-size:1.4rem;">${score}/100</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">YEARLY NET</div>
        <div class="stat-value gold">$${yearlyNet.toFixed(0)}</div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-primary" onclick="saveDealToWatchlist('${name.replace(/'/g, "\\'")}', ${price}, ${th}, ${ee}, ${costPerTH.toFixed(2)}, '${breakevenMonths}', '${verdict.replace(/'/g, "\\'")}', ${score})">⭐ SAVE TO WATCHLIST</button>
      ${isGreatDeal ? '<button class="btn btn-purple" onclick="shareGreatDeal(\'' + name.replace(/'/g, "\\'") + '\', ' + price + ', ' + th + ', ' + costPerTH.toFixed(2) + ')">📢 SHARE DEAL</button>' : ''}
    </div>
  `;
  
  // Trigger alert for great deals
  if(isGreatDeal) {
    triggerDealAlert(name, price, th, costPerTH, score);
  }
}

function triggerDealAlert(name, price, th, costPerTH, score) {
  // Visual alert
  const alertBox = document.createElement('div');
  alertBox.innerHTML = `
    <div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:16px 24px;border-radius:12px;box-shadow:0 8px 32px rgba(16,185,129,0.4);animation:slideDown 0.3s ease;">

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.value = 0.1;
      osc.start();
      osc.stop(ctx.currentTime + 0.15);

        const osc2 = ctx.createOscillator();

}

function togglePriceAlert(id) {
  const alert = (data.priceAlerts || []).find(a => a.id === id);
  if(alert) {
    alert.active = !alert.active;
    saveData();
    renderPriceAlerts();
  }
}

function deletePriceAlert(id) {
  data.priceAlerts = (data.priceAlerts || []).filter(a => a.id !== id);
  saveData();
  renderPriceAlerts();
}

function checkPriceAlerts(name, price, th, costPerTH) {
  const alerts = (data.priceAlerts || []).filter(a => a.active);
  
  for(const alert of alerts) {
    // Check if name matches (case insensitive, partial match)
    const nameMatch = name.toLowerCase().includes(alert.name.toLowerCase()) || 
                      alert.name.toLowerCase().includes(name.toLowerCase());
    
    if(!nameMatch) continue;
    
    // Check TH if specified
    if(alert.th && Math.abs(th - alert.th) > 1) continue;
    
    // Check price conditions
    let priceMatch = false;
    if(alert.maxPrice && price <= alert.maxPrice) priceMatch = true;
    if(alert.maxCostTH && costPerTH <= alert.maxCostTH) priceMatch = true;
    
    if(priceMatch) {
      triggerPriceDropAlert(alert, name, price, th, costPerTH);
      return true;
    }
  }
  return false;
}

// Enhanced watchlist with price history
function saveDealToWatchlist(name, price, th, ee, costPerTH, breakeven, verdict, score) {
  data.watchlist = data.watchlist || [];
  
  // Check if similar item exists (by name)
  const existing = data.watchlist.find(w => w.name.toLowerCase() === name.toLowerCase());
  
  if(existing) {
    // Update existing - add to price history
    existing.priceHistory = existing.priceHistory || [];
    existing.priceHistory.push({
      price,
      costPerTH: parseFloat(costPerTH),
      date: new Date().toISOString()
    });
    existing.price = price;
    existing.costPerTH = parseFloat(costPerTH);
    existing.lastUpdated = new Date().toISOString();
    
    // Check for price drop
    if(existing.priceHistory.length > 1) {
      const prevPrice = existing.priceHistory[existing.priceHistory.length - 2].price;
      if(price < prevPrice) {
        existing.trend = 'down';
        existing.priceDrop = prevPrice - price;
      } else if(price > prevPrice) {
        existing.trend = 'up';
        existing.priceIncrease = price - prevPrice;
      } else {
        existing.trend = 'flat';
      }
    }
  } else {
    // New watchlist item
    data.watchlist.unshift({
      id: Date.now(),
      name,
      price,
      th,
      ee,
      costPerTH: parseFloat(costPerTH),
      breakeven,
      verdict,
      score,
      date: new Date().toISOString().split('T')[0],
      targetPrice: null,
      targetCostTH: null,
      priceHistory: [{
        price,
        costPerTH: parseFloat(costPerTH),
        date: new Date().toISOString()
      }],
      trend: null,
      alertEnabled: true
    });
  }
  
  saveData();
  renderWatchlist();
  updateHistorySelect();
  
  // Check price alerts
  checkPriceAlerts(name, price, th, parseFloat(costPerTH));
  
  // Feedback
  const btn = event?.target;
  if(btn) {
    btn.textContent = existing ? '🔄 UPDATED!' : '✅ SAVED!';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = '⭐ SAVE TO WATCHLIST';
      btn.disabled = false;
    }, 2000);
  }
}

  }).join('');
}

function setWatchlistTarget(id, type, value) {
  const item = (data.watchlist || []).find(w => w.id === id);
  if(item) {
    if(type === 'price') {
      item.targetPrice = parseFloat(value) || null;
    } else if(type === 'costTH') {
      item.targetCostTH = parseFloat(value) || null;
    }
    saveData();
    
    // Check if current price meets new target
    if(item.targetPrice && item.price <= item.targetPrice) {
      triggerPriceDropAlert({ name: item.name }, item.name, item.price, item.th, item.costPerTH);
    }
  }
}

function toggleWatchlistAlert(id) {
  const item = (data.watchlist || []).find(w => w.id === id);
  if(item) {
    item.alertEnabled = !item.alertEnabled;
    saveData();
    renderWatchlist();
  }
}

function promptUpdatePrice(id) {
  const item = (data.watchlist || []).find(w => w.id === id);
  if(!item) return;
  
  const newPrice = prompt(`Enter new price for "${item.name}":\n(Current: $${item.price})`, item.price);
  if(newPrice === null) return;
  
  const price = parseFloat(newPrice);
  if(isNaN(price) || price <= 0) {
    alert('Invalid price');
    return;
  }
  
  const newCostTH = price / item.th;
  
  // Add to price history
  item.priceHistory = item.priceHistory || [];
  const prevPrice = item.price;
  
  item.priceHistory.push({
    price,
    costPerTH: newCostTH,
    date: new Date().toISOString()
  });
  
  // Update current values
  item.price = price;
  item.costPerTH = newCostTH;
  item.lastUpdated = new Date().toISOString();
  
  // Set trend
  if(price < prevPrice) {
    item.trend = 'down';
    item.priceDrop = prevPrice - price;
    delete item.priceIncrease;
    
    // Check if target met
    if(item.alertEnabled) {
      if((item.targetPrice && price <= item.targetPrice) || 
         (item.targetCostTH && newCostTH <= item.targetCostTH)) {
        triggerPriceDropAlert({ name: item.name }, item.name, price, item.th, newCostTH);
      }
    }
  } else if(price > prevPrice) {
    item.trend = 'up';
    item.priceIncrease = price - prevPrice;
    delete item.priceDrop;
  } else {
    item.trend = 'flat';
    delete item.priceDrop;
    delete item.priceIncrease;
  }
  
  saveData();
  renderWatchlist();
  updateHistorySelect();
  
  // Also check global price alerts
  checkPriceAlerts(item.name, price, item.th, newCostTH);
}

function updateHistorySelect() {
  const select = document.getElementById('historySelect');
  if(!select) return;
  
  const list = data.watchlist || [];
  select.innerHTML = '<option value="">-- Select from watchlist --</option>' +
    list.map(w => `<option value="${w.id}">${w.name} (${w.priceHistory?.length || 1} prices)</option>`).join('');
}

function showPriceHistory() {
  const select = document.getElementById('historySelect');
  const container = document.getElementById('priceHistoryChart');
  if(!select || !container) return;
  
  const id = parseInt(select.value);
  if(!id) {
    container.innerHTML = '';
    return;
  }
  
  const item = (data.watchlist || []).find(w => w.id === id);
  if(!item || !item.priceHistory || item.priceHistory.length === 0) {
    container.innerHTML = '<div class="text-dim" style="text-align:center;padding:10px;">No price history yet</div>';
    return;
  }
  
  const history = item.priceHistory;
  const minPrice = Math.min(...history.map(h => h.price)) * 0.9;
  const maxPrice = Math.max(...history.map(h => h.price)) * 1.1;
  const range = maxPrice - minPrice;
  
  // Simple ASCII-style chart
  const chartHeight = 100;
  const points = history.map((h, i) => {
    const x = (i / (history.length - 1 || 1)) * 100;
    const y = chartHeight - ((h.price - minPrice) / range) * chartHeight;
    return { x, y, price: h.price, date: h.date };
  });
  
  // Determine trend
  const firstPrice = history[0].price;
  const lastPrice = history[history.length - 1].price;
  const overallTrend = lastPrice < firstPrice ? 'down' : lastPrice > firstPrice ? 'up' : 'flat';
  const trendColor = overallTrend === 'down' ? 'var(--accent-green)' : overallTrend === 'up' ? 'var(--accent-red)' : 'var(--accent-cyan)';
  const trendIcon = overallTrend === 'down' ? '📉' : overallTrend === 'up' ? '📈' : '➖';
  const changeAmt = Math.abs(lastPrice - firstPrice);
  const changePct = ((changeAmt / firstPrice) * 100).toFixed(1);
  
  container.innerHTML = `
    <div class="stat-grid" style="margin-bottom:10px;">
      <div class="stat-box"><div class="stat-label">FIRST PRICE</div><div class="stat-value neu">$${firstPrice}</div></div>
      <div class="stat-box"><div class="stat-label">CURRENT</div><div class="stat-value" style="color:${trendColor};">$${lastPrice}</div></div>
      <div class="stat-box"><div class="stat-label">CHANGE</div><div class="stat-value" style="color:${trendColor};">${trendIcon} ${overallTrend === 'down' ? '-' : '+'}$${changeAmt} (${changePct}%)</div></div>
      <div class="stat-box"><div class="stat-label">UPDATES</div><div class="stat-value neu">${history.length}</div></div>
    </div>
    <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:10px;">
      <svg width="100%" height="${chartHeight + 40}" viewBox="0 0 100 ${chartHeight + 40}" preserveAspectRatio="none">
        <!-- Grid lines -->
        <line x1="0" y1="0" x2="100" y2="0" stroke="var(--border)" stroke-width="0.5"/>
        <line x1="0" y1="${chartHeight/2}" x2="100" y2="${chartHeight/2}" stroke="var(--border)" stroke-width="0.5"/>
        <line x1="0" y1="${chartHeight}" x2="100" y2="${chartHeight}" stroke="var(--border)" stroke-width="0.5"/>
        
        <!-- Price line -->
        <polyline 
          points="${points.map(p => `${p.x},${p.y}`).join(' ')}"
          fill="none" 
          stroke="${trendColor}" 
          stroke-width="2"
        />
        
        <!-- Data points -->
        ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${trendColor}"/>`).join('')}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:0.5rem;color:var(--text-dim);margin-top:4px;">
        <span>$${minPrice.toFixed(0)}</span>
        <span>${history.length} data points</span>
        <span>$${maxPrice.toFixed(0)}</span>
      </div>
    </div>
    <div style="margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;max-height:150px;overflow-y:auto;">
      <table style="width:100%;">
        <thead><tr><th>DATE</th><th>PRICE</th><th>$/TH</th><th>CHANGE</th></tr></thead>
        <tbody>
          ${history.slice().reverse().map((h, i, arr) => {
            const prev = arr[i + 1];
            const change = prev ? h.price - prev.price : 0;
            const changeClass = change < 0 ? 'text-green' : change > 0 ? 'text-red' : '';
            return `<tr>
              <td>${new Date(h.date).toLocaleDateString()}</td>
              <td>$${h.price}</td>
              <td>$${h.costPerTH.toFixed(2)}</td>
              <td class="${changeClass}">${change !== 0 ? (change > 0 ? '+' : '') + change : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// Update initScanner to also render price alerts
function initScanner() {
  // Load alert thresholds
  const a = data.alerts || {};
  if(document.getElementById('alertMaxCostTH')) document.getElementById('alertMaxCostTH').value = a.maxCostTH || 50;
  if(document.getElementById('alertGreatCostTH')) document.getElementById('alertGreatCostTH').value = a.greatCostTH || 40;
  if(document.getElementById('alertMaxEE')) document.getElementById('alertMaxEE').value = a.maxEE || 18;
  if(document.getElementById('alertMaxBreakeven')) document.getElementById('alertMaxBreakeven').value = a.maxBreakeven || 18;
  
  // Render watchlist and price alerts
  renderWatchlist();
  renderPriceAlerts();
  updateHistorySelect();
  
  // Request notification permission
  if('Notification' in window && Notification.permission === 'default') {
    // Don't auto-request, let user trigger it
  }
}

// =====================================================
// TRACKER (Miner Wars Logging)
// =====================================================
function initTracker() {
  document.getElementById('logDate').valueAsDate = new Date();
}

function addEntry() {
  const date = document.getElementById('logDate').value;
  const mult = document.getElementById('logMult').value;
  const spent = parseFloat(document.getElementById('logSpent').value) || 0;
  const earned = parseFloat(document.getElementById('logEarned').value) || 0;
  const won = document.getElementById('logWon').value;
  
  if(!date) return alert('Select a date');
  
  data.entries.push({
    id: Date.now(),
    date, mult, spent, earned, won,
    net: earned - spent,
    timestamp: new Date().toISOString()
  });
  
  saveData();
  renderEntries();
  
  // Clear form
  document.getElementById('logSpent').value = '0';
  document.getElementById('logEarned').value = '0';
  document.getElementById('logWon').value = 'no';
}

function deleteEntry(id) {
  data.entries = data.entries.filter(e => e.id !== id);
  saveData();
  renderEntries();
}

function renderEntries() {
  const entries = data.entries.sort((a,b) => new Date(b.date) - new Date(a.date));
  
  // Stats
  const spent = entries.reduce((s,e) => s + e.spent, 0);
  const earned = entries.reduce((s,e) => s + e.earned, 0);
  const net = earned - spent;
  const roi = spent > 0 ? ((net / spent) * 100) : 0;
  const blocks = entries.filter(e => e.won !== 'no').length;
  
  document.getElementById('trkSpent').textContent = spent.toLocaleString();
  document.getElementById('trkEarned').textContent = earned.toLocaleString();
  document.getElementById('trkNet').textContent = (net >= 0 ? '+' : '') + net.toLocaleString();
  document.getElementById('trkNet').className = 'stat-value ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : 'neu');
  document.getElementById('trkROI').textContent = roi.toFixed(1) + '%';
  document.getElementById('trkROI').className = 'stat-value ' + (roi > 0 ? 'pos' : roi < 0 ? 'neg' : 'neu');
  document.getElementById('trkBlocks').textContent = blocks;
  document.getElementById('trkRounds').textContent = entries.length;
  
  // Table
  const tbody = document.getElementById('logTable');
  if(entries.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:20px;">No entries yet. Log your first round above!</td></tr>';
    return;
  }
  
  tbody.innerHTML = entries.slice(0, 50).map(e => {
    const netClass = e.net > 0 ? 'text-green' : e.net < 0 ? 'text-red' : '';
    const wonTag = e.won === 'personal' ? '<span class="tag tag-green">Personal</span>' :
                   e.won === 'clan' ? '<span class="tag tag-cyan">Clan</span>' : '—';
    return `<tr>
      <td>${e.date}</td>
      <td><span class="tag tag-purple">${e.mult}</span></td>
      <td class="text-red">${e.spent}</td>
      <td class="text-green">${e.earned}</td>
      <td class="${netClass}">${e.net >= 0 ? '+' : ''}${e.net.toFixed(1)}</td>
      <td>${wonTag}</td>
      <td><button class="del-btn" onclick="deleteEntry(${e.id})">✕</button></td>
    </tr>`;
  }).join('');
}

// =====================================================
// SETTINGS
// =====================================================
function loadSettingsForm() {
  const s = data.settings;
  document.getElementById('setTH').value = s.th;
  document.getElementById('setEE').value = s.ee;
  document.getElementById('setDisc').value = s.disc;
  document.getElementById('setSats').value = s.sats;
  document.getElementById('setClan').value = s.clan;
  document.getElementById('setClanTH').value = s.clanTH;
  document.getElementById('setClanShare').value = s.clanShare;
  document.getElementById('setLeague').value = s.league;
}

function saveSettings() {
  data.settings = {
    th: parseFloat(document.getElementById('setTH').value) || 29.08,
    ee: parseFloat(document.getElementById('setEE').value) || 17.75,
    disc: parseFloat(document.getElementById('setDisc').value) || 23,
    sats: parseFloat(document.getElementById('setSats').value) || 38,
    clan: document.getElementById('setClan').value || '🌀 GravitationaL 🌀',
    clanTH: parseFloat(document.getElementById('setClanTH').value) || 19378,
    clanShare: parseFloat(document.getElementById('setClanShare').value) || 2.63,
    league: document.getElementById('setLeague').value || 'Odyssey'
  };
  saveData();
  alert('✅ Settings saved!');
}

function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gm-roi-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function exportCSV() {
  const rows = [['Date','Mult','Spent','Earned','Net','Won']];
  data.entries.forEach(e => rows.push([e.date, e.mult, e.spent, e.earned, e.net, e.won]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mw-history-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

function importData(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if(confirm(`Import ${imported.entries?.length || 0} entries and settings?`)) {
        data = {...data, ...imported};
        saveData();
        alert('✅ Imported!');
        switchTab('dashboard');
      }
    } catch(err) { alert('Error: ' + err.message); }
  };
  reader.readAsText(file);
}

function nukeData() {
  if(!confirm('⚠️ DELETE ALL DATA?')) return;
  if(!confirm('Are you sure? This cannot be undone!')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = { 
    settings: { th: 29.08, ee: 17.75, disc: 23, sats: 38, clanTH: 19378, clanShare: 2.63, clan: '🌀 GravitationaL 🌀', league: 'Odyssey' }, 
    entries: [], 
    prices: { btc: 0, gmt: 0, sats: 38 },
    watchlist: [],
    priceAlerts: [],
    alerts: { maxCostTH: 50, greatCostTH: 40, maxEE: 18, maxBreakeven: 18, soundEnabled: true, browserNotify: false }
  };
  switchTab('dashboard');
}

// =====================================================
// INITIALIZATION
// =====================================================
function init() {
  loadData();
  fetchPrices();
  
  // Render initial tab
  document.getElementById('tabContent').innerHTML = tabTemplates.dashboard;
  initDashboard();
  
  // Refresh prices every 60 seconds
  setInterval(fetchPrices, 60000);
}

// Start app
init();
</script>
